[project]
name = "ldaca-web-app-backend"
version = "0.1.2"
description = "LDaCA Web App Backend - FastAPI backend for the Language Data Commons of Australia"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Australian Text Analytics Platform" }
]
keywords = ["ldaca", "text-analytics", "corpus", "linguistics", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "aiosqlite>=0.21.0",
    "fastapi-users[sqlalchemy]>=14.0.1",  # Includes fastapi, python-multipart, sqlalchemy
    "fastapi[standard]>=0.115.14",  # Includes uvicorn, pydantic, starlette
    "google-auth-oauthlib>=1.2.2",  # Includes google-auth
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "psutil>=6.1.0",  # Process management for proper cleanup of child processes
    "docframe",  # Includes nltk, polars, spacy, bertopic
    "docworkspace",
]

[project.optional-dependencies]
deploy = [
    "jupyter-server-proxy>=4.4.0",
    "ipython>=9.5.0",
]

[project.scripts]
ldaca_web_app_backend = "ldaca_web_app_backend.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "workspace: marks tests related to workspace functionality",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0",
    "twine>=6.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ldaca_web_app_backend"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
