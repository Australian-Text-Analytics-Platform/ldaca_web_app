[package]
name = "ldaca-wordflow"
version = "0.5.4"
description = "LDaCA Wordflow Desktop Application"
authors = ["Chao Sun", "Senhui Guo", "Sydney Informatics Hub"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Slim desktop variant: ships no bundled Python runtime. On first launch the
# shell uses a bundled `uv` to create a venv and install ldaca-wordflow from
# PyPI into the per-user data dir, then points the existing launch path at it
# via LDACA_BACKEND_PYTHON / LDACA_BACKEND_RUNTIME.
slim = []
# Bundle desktop variant: ships a pre-built, self-contained Python runtime as a
# single `backend-runtime.tar.zst` resource and extracts it (in-process zstd+tar,
# no system `tar` dependency) into the SAME per-user runtime dir the slim variant
# uses. Offline-capable instant-ish first launch; shares the slim runtime layout.
bundle = ["dep:zstd", "dep:tar"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
# Used by the `download_to_downloads` Tauri command to fetch large export
# bodies from the local backend and stream them to disk. Bypassing the JS
# fetch / plugin-http body path avoids the WebView2 + IPC reliability
# issues we hit on Windows for >10MB responses.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util"] }
# Bundle variant only (optional, gated by the `bundle` feature): in-process
# extraction of the shipped runtime tarball — no reliance on a system `tar`.
zstd = { version = "0.13", optional = true }
tar = { version = "0.4", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
