[project]
name = "ldaca-web-app-workspace"
version = "0.3.5"
description = "LDaCA Web App Workspace"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["ldaca-web-app", "ldaca-loader"]

[tool.uv.sources]
ldaca-web-app = { path = "./backend", editable = true }
ldaca-loader = { git = "https://github.com/Australian-Text-Analytics-Platform/ldaca-tabulator", branch = "ldaca_web_app_integration" }

[tool.pytest.ini_options]
testpaths = ["tests"]
