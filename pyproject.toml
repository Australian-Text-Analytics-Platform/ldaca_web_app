[project]
name = "ldaca-web-app-workspace"
version = "0.0.1"
description = "LDaCA Web App Workspace"
requires-python = ">=3.14"
dependencies = [
    "ldaca-web-app-backend",
]

[tool.uv.workspace]
members = [
    "backend",
    "backend/docworkspace",
    "backend/ldaca-tabulator",
    "backend/polars-text"
]

[tool.uv.sources]
docworkspace = { workspace = true }
ldaca-web-app-backend = { workspace = true }
ldaca-loader = { workspace = true }
polars-text = { workspace = true }
