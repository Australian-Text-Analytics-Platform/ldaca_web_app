[project]
name = "ldaca-wordflow-workspace"
version = "0.6.0"
description = "LDaCA Wordflow Workspace"
requires-python = ">=3.14"
dependencies = ["ldaca-wordflow", "rocrate-tabular"]

[tool.uv.sources]
docworkspace = { path = "./docworkspace", editable = true }
ldaca-wordflow = { path = "./backend", editable = true }
polars-text = { path = "./polars-text", editable = true }
polars-source-utils = { path = "./polars-source-utils", editable = true }
rocrate-tabular = { path = "./backend/src/ldaca_wordflow/_vendor/rocrate-tabular" }

[tool.pytest.ini_options]
testpaths = ["tests"]
