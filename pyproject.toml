[project]
name = "ldaca-wordflow-workspace"
version = "0.7.5"
description = "LDaCA Wordflow Workspace"
requires-python = ">=3.14"
dependencies = ["ldaca-wordflow"]

[tool.uv.sources]
ldaca-wordflow = { path = "./backend", editable = true }
polars-text = { path = "./polars-text", editable = true }
polars-source-utils = { path = "./polars-source-utils", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
