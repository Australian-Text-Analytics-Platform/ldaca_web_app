[project]
name = "ldaca-wordflow-workspace"
version = "0.5.0"
description = "LDaCA Wordflow Workspace"
requires-python = ">=3.14"
dependencies = ["ldaca-wordflow", "rocrate-tabular"]

[tool.uv.sources]
ldaca-wordflow = { path = "./backend", editable = true }
rocrate-tabular = { path = "./backend/src/ldaca_wordflow/_vendor/rocrate-tabular" }

[tool.pytest.ini_options]
testpaths = ["tests"]
