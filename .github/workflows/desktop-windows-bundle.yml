name: Desktop Windows Build — Bundle (x64)

# Builds the BUNDLE Windows desktop variant: ships a pre-built, self-contained
# Python runtime as ONE `backend-runtime.tar.zst` resource. On first launch the
# shell extracts it (in-process zstd+tar) into the SAME per-user runtime dir the
# slim variant uses (see src-tauri/src/main.rs `ensure_bundle_runtime`). The MSI
# is left UNSIGNED (ad-hoc) — there's no Windows code-signing cert wired up. The
# legacy desktop-windows.yml and the macOS builds are intentionally untouched.

on:
  # TEMPORARY (prototype): run while the workflow lives only on the feature
  # branch. Remove when promoting to the default branch (workflow_dispatch).
  push:
    branches:
      - tauri/slim-dmg-prototype
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional Git ref to build (branch, tag, or SHA)"
        required: false
        type: string

permissions:
  contents: read

env:
  ZSTD_VERSION: "1.5.6"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-windows-bundle-x64:
    runs-on: windows-latest
    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force -ErrorAction SilentlyContinue

      - name: Checkout repository with submodules
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-bundle-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bundle-cargo-

      - name: Install uv CLI
        uses: astral-sh/setup-uv@v7

      - name: Cache uv workspace
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/uv
          key: ${{ runner.os }}-bundle-uv-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-bundle-uv-

      - name: Install Node workspace dependencies
        shell: pwsh
        run: npm ci

      - name: Package backend runtime
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          uv run --no-project --python 3.14 python scripts/package_backend_runtime.py --clean --python-version 3.14

      - name: Prune, validate, and archive the runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $runtime = "dist-tauri\backend-runtime"
          if (-not (Test-Path $runtime)) { throw "backend-runtime not produced" }

          # Reclaim ~179 MB: drop the unused `_polars_runtime_32` CPU-feature
          # build (the shell forces POLARS_FORCE_PKG=compat so it never loads).
          Get-ChildItem -Path $runtime -Recurse -Directory -Filter "_polars_runtime_32" |
            ForEach-Object { Remove-Item -Recurse -Force $_.FullName }

          # Validate the pruned runtime imports the backend on the compat build.
          $py = Join-Path $runtime "python\Scripts\python.exe"
          $env:POLARS_FORCE_PKG = "compat"
          & $py -c "import encodings, ldaca_wordflow, polars_text, sys; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw "runtime import validation failed" }

          # Fetch a pinned zstd.exe (not reliably on PATH on the runner).
          $zstdUrl = "https://github.com/facebook/zstd/releases/download/v$env:ZSTD_VERSION/zstd-v$env:ZSTD_VERSION-win64.zip"
          Invoke-WebRequest -Uri $zstdUrl -OutFile zstd.zip
          Expand-Archive -Path zstd.zip -DestinationPath zstd_extract -Force
          $zstd = (Get-ChildItem -Path zstd_extract -Recurse -Filter zstd.exe | Select-Object -First 1).FullName

          # Archive the runtime CONTENTS so extraction yields python\,
          # managed-python\ at the runtime-dir root (matches the slim layout).
          # Two steps (tar -> file, then zstd -> file): never pipe binary through
          # a PowerShell pipeline, which would corrupt it.
          tar.exe -C $runtime -cf runtime.tar .
          if ($LASTEXITCODE -ne 0) { throw "tar failed" }
          & $zstd -19 -T0 -f runtime.tar -o frontend\src-tauri\backend-runtime.tar.zst
          if ($LASTEXITCODE -ne 0) { throw "zstd compression failed" }
          Get-Item frontend\src-tauri\backend-runtime.tar.zst | Select-Object Name, Length

      - name: Build bundle Tauri app (unsigned)
        shell: bash
        working-directory: frontend
        run: |
          npx tauri build \
            --features bundle \
            --config src-tauri/tauri.bundle.windows.conf.json

      - name: Locate MSI
        id: msi
        shell: bash
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          msi=$(ls src-tauri/target/release/bundle/msi/*.msi | head -1)
          test -n "$msi"
          # Workspace-relative path: upload-artifact is node-based and cannot
          # resolve the MSYS-style /d/a/... path that bash `pwd` returns on Windows.
          rel="frontend/$msi"
          echo "path=$rel" >> "$GITHUB_OUTPUT"
          echo "Built MSI: $rel"

      - name: Upload bundle MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ldaca-wordflow-bundle-windows-x64
          path: ${{ steps.msi.outputs.path }}
          if-no-files-found: error
          retention-days: 14
