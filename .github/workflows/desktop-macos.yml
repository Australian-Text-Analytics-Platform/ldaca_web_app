name: Desktop macOS Build (Apple Silicon)

on:
  workflow_dispatch:
    inputs:
      build-notes:
        description: "Optional note about this build"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-macos-apple-silicon:
    runs-on: macos-14
    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Prepare cache directories
        run: |
          mkdir -p ~/.cargo/registry
          mkdir -p ~/.cargo/git
          mkdir -p ~/.rustup
          mkdir -p ~/.cache/uv
          mkdir -p ~/.local/share/uv

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache rustup toolchains
        uses: actions/cache@v4
        with:
          path: ~/.rustup
          key: ${{ runner.os }}-rustup-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rustup-

      - name: Install uv CLI
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache uv workspace
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Package backend runtime
        shell: bash
        working-directory: backend
        run: |
          set -Eeuo pipefail
          PYTHON_VERSION="3.12"
          DIST_ROOT="$PWD/dist-tauri"
          OUTPUT_DIR="$DIST_ROOT/backend-runtime"
          LOCKFILE="$DIST_ROOT/backend-runtime-requirements.txt"

          echo "🧹 Cleaning backend dist directory"
          rm -rf "$DIST_ROOT"
          mkdir -p "$OUTPUT_DIR"

          echo "🧰 Installing Python ${PYTHON_VERSION} via uv"
          uv python install "$PYTHON_VERSION"

          echo "🔒 Resolving backend dependencies"
          uv pip compile pyproject.toml \
            --python-version "$PYTHON_VERSION" \
            --output-file "$LOCKFILE"

          echo "🐍 Creating backend virtual environment"
          uv venv --python "$PYTHON_VERSION" "$OUTPUT_DIR/.venv"

          VENV_BIN_DIR="$OUTPUT_DIR/.venv/bin"
          if [[ ! -d "$VENV_BIN_DIR" ]]; then
            VENV_BIN_DIR="$OUTPUT_DIR/.venv/Scripts"
          fi
          PYTHON_BIN="$VENV_BIN_DIR/python"
          if [[ ! -x "$PYTHON_BIN" ]]; then
            PYTHON_BIN="$VENV_BIN_DIR/python.exe"
          fi
          if [[ ! -x "$PYTHON_BIN" ]]; then
            echo "Python executable not found in runtime venv" >&2
            exit 1
          fi

          echo "📥 Installing backend requirements into runtime venv"
          uv pip install --python "$PYTHON_BIN" -r "$LOCKFILE"

          echo "📦 Installing backend package into runtime venv"
          uv pip install --python "$PYTHON_BIN" "$PWD"

          RUNNER_PATH="$OUTPUT_DIR/run_backend.sh"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -Eeuo pipefail' \
            '' \
            'SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' \
            'VENV_DIR="$SCRIPT_DIR/.venv"' \
            'if [[ -d "$VENV_DIR/bin" ]]; then' \
            '    PYTHON_BIN="$VENV_DIR/bin/python"' \
            'elif [[ -d "$VENV_DIR/Scripts" ]]; then' \
            '    PYTHON_BIN="$VENV_DIR/Scripts/python.exe"' \
            'else' \
            '    echo "Virtual environment missing at $VENV_DIR" >&2' \
            '    exit 1' \
            'fi' \
            '' \
            'if [[ -f "$SCRIPT_DIR/.env" ]]; then' \
            '    set -a' \
            '    source "$SCRIPT_DIR/.env"' \
            '    set +a' \
            'fi' \
            '' \
            'if [[ -f "$SCRIPT_DIR/.env.desktop" ]]; then' \
            '    set -a' \
            '    source "$SCRIPT_DIR/.env.desktop"' \
            '    set +a' \
            'fi' \
            '' \
            'PORT_VALUE="${BACKEND_PORT:-${LDACA_BACKEND_PORT:-8001}}"' \
            'HOST_VALUE="${SERVER_HOST:-${LDACA_SERVER_HOST:-127.0.0.1}}"' \
            '' \
            'export BACKEND_PORT="$PORT_VALUE"' \
            'export LDACA_BACKEND_PORT="$PORT_VALUE"' \
            'export SERVER_HOST="$HOST_VALUE"' \
            'export LDACA_SERVER_HOST="$HOST_VALUE"' \
            'export PYTHONUNBUFFERED=1' \
            'export LDACA_CONFIG_PROFILE="${LDACA_CONFIG_PROFILE:-desktop}"' \
            '' \
            'exec "$PYTHON_BIN" -m ldaca_web_app_backend.cli' \
            > "$RUNNER_PATH"

          chmod +x "$RUNNER_PATH"

          if [[ "$(uname -s)" == "Darwin" ]]; then
            echo "🔧 Creating macOS sidecar aliases"
            for target in aarch64-apple-darwin x86_64-apple-darwin; do
              alias_path="${RUNNER_PATH}-${target}"
              cp "$RUNNER_PATH" "$alias_path"
              chmod +x "$alias_path"
            done
          fi

          printf '%s\n' \
            '# Desktop-specific overrides for the bundled backend' \
            '# Copy this file to .env.desktop and adjust values if needed.' \
            '#' \
            '#BACKEND_PORT=8001' \
            '#SERVER_HOST=127.0.0.1' \
            '#LDACA_DATA_ROOT=$HOME/Documents/ldaca' \
            > "$OUTPUT_DIR/.env.desktop.example"

          printf '%s\n' \
            '# LDaCA Backend Runtime' \
            '' \
            'This folder is generated during the desktop build and contains:' \
            '' \
            '- `.venv/` – self-contained Python interpreter with all backend dependencies' \
            '- `run_backend.sh` – launcher script used by the Tauri shell' \
            '- `run_backend.sh-*` – architecture-specific copies for Tauri sidecar lookup' \
            '- `.env.desktop.example` – optional overrides for runtime configuration' \
            '' \
            'The launcher expects the following environment variables (all optional):' \
            '' \
            '| Variable | Purpose |' \
            '|----------|---------|' \
            '| `BACKEND_PORT` / `LDACA_BACKEND_PORT` | Port to bind the FastAPI server (defaults to 8001) |' \
            '| `SERVER_HOST` / `LDACA_SERVER_HOST` | Network interface to bind (defaults to 127.0.0.1) |' \
            '| `LDACA_DATA_ROOT` | Location for workspace + user data (default `~/Documents/ldaca`) |' \
            '| `LDACA_CONFIG_PROFILE` | Arbitrary label for downstream logging (defaults to `desktop`) |' \
            '' \
            'At runtime the Tauri shell executes `run_backend.sh`, which in turn boots' \
            '`ldaca_web_app_backend.cli` inside the bundled virtual environment.' \
            > "$OUTPUT_DIR/README_RUNTIME.md"

          echo "✅ Backend runtime packaged at $OUTPUT_DIR"

      - name: Install frontend dependencies
        shell: bash
        working-directory: frontend
        run: npm install

      - name: Build frontend
        shell: bash
        working-directory: frontend
        run: npm run build

      - name: Install root dependencies
        shell: bash
        run: npm install

      - name: Build Tauri desktop application
        shell: bash
        run: npm run tauri:build

      - name: Label DMG output for Apple Silicon
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          dmg_files=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ ${#dmg_files[@]} -eq 0 ]; then
            echo "No DMG output found" >&2
            exit 1
          fi
          primary_dmg="${dmg_files[0]}"
          labeled_dmg="src-tauri/target/release/bundle/dmg/ldaca-desktop-apple-silicon.dmg"
          cp "$primary_dmg" "$labeled_dmg"
          echo "APPLE_SILICON_DMG=$labeled_dmg" >> "$GITHUB_ENV"
          echo "Primary DMG: $primary_dmg"
          echo "Labeled DMG: $labeled_dmg"

      - name: Upload macOS Apple Silicon DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ldaca-desktop-macos-apple-silicon
          path: ${{ env.APPLE_SILICON_DMG }}
          if-no-files-found: error
          retention-days: 14
