name: Desktop macOS Build (Apple Silicon)

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional Git ref to build (branch, tag, or SHA)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-macos-apple-silicon:
    runs-on: macos-latest
    env:
      CI: "true"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Rust nightly for backend extension builds
        uses: dtolnay/rust-toolchain@nightly

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Prepare cache directories
        run: |
          mkdir -p ~/.cargo/registry
          mkdir -p ~/.cargo/git
          mkdir -p ~/.rustup

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key:
            ${{ runner.os }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.toml',
            'frontend/src-tauri/Cargo.lock', 'polars-text/Cargo.toml',
            'polars-text/Cargo.lock', 'polars-source-utils/Cargo.toml',
            'polars-source-utils/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache rustup toolchains
        uses: actions/cache@v5
        with:
          path: ~/.rustup
          key:
            ${{ runner.os }}-rustup-${{ hashFiles('frontend/src-tauri/Cargo.toml',
            'frontend/src-tauri/Cargo.lock', 'polars-text/Cargo.toml',
            'polars-text/Cargo.lock', 'polars-source-utils/Cargo.toml',
            'polars-source-utils/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rustup-

      - name: Install uv CLI
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock

      - name: Install Node dependencies
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Validate backend package
        working-directory: backend
        run: |
          uv sync --frozen --group dev
          uv run ruff check .
          uv run ty check
          uv run pytest -q

      - name: Validate desktop supervisor and runtime contract
        working-directory: frontend
        run: |
          node --test ../scripts/prepare-backend-runtime.test.mjs
          node --test scripts/stage-backend-runtime.test-node.mjs
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Prepare backend runtime
        shell: bash
        working-directory: frontend
        run: pnpm prepare:backend-runtime

      - name: Build Tauri desktop application
        shell: bash
        working-directory: frontend
        run: pnpm tauri build --bundles app,dmg

      - name: Validate bundled backend runtime
        shell: bash
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          repo_root="$(cd .. && pwd -P)"
          app_path="$repo_root/frontend/src-tauri/target/release/bundle/macos/LDaCA Wordflow.app"
          runtime_path="$app_path/Contents/Resources/backend-runtime"

          test -d "$runtime_path"
          test -f "$runtime_path/runtime-manifest.json"
          test -f "$runtime_path/python/lib/libpython3.14.dylib"

          # Exercise the same manifest resolver and environment builder used by launch.
          LDACA_TEST_RUNTIME_ROOT="$runtime_path" \
            cargo test --manifest-path src-tauri/Cargo.toml \
            packaged_runtime_matches_launcher_environment -- --ignored

          echo "Bundled runtime validation succeeded: $runtime_path"

      - name: Label DMG output for Apple Silicon
        id: label-dmg
        shell: bash
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          repo_root="$(cd .. && pwd -P)"
          dmg_files=("$repo_root"/frontend/src-tauri/target/release/bundle/dmg/*.dmg)
          if [ ${#dmg_files[@]} -eq 0 ]; then
            echo "No DMG output found" >&2
            exit 1
          fi
          primary_dmg="${dmg_files[0]}"
          app_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          labeled_dmg="$repo_root/frontend/src-tauri/target/release/bundle/dmg/ldaca-desktop-apple-silicon-${app_version}.dmg"
          cp "$primary_dmg" "$labeled_dmg"
          echo "path=$labeled_dmg" >> "$GITHUB_OUTPUT"
          echo "Primary DMG: $primary_dmg"
          echo "Labeled DMG: $labeled_dmg"

      - name: Show sccache stats
        if: always()
        continue-on-error: true
        shell: bash
        run: sccache --show-stats

      - name: Upload macOS Apple Silicon DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: ldaca-desktop-macos-apple-silicon
          path: ${{ steps.label-dmg.outputs.path }}
          if-no-files-found: error
          retention-days: 14
