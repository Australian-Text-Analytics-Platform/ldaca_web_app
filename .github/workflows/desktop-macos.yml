name: Desktop macOS Build (Apple Silicon)

on:
  workflow_call:
    inputs:
      build-notes:
        description: "Optional note about this build"
        required: false
        type: string
      ref:
        description: "Git ref to build"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      build-notes:
        description: "Optional note about this build"
        required: false
        type: string
      ref:
        description: "Optional Git ref to build (branch, tag, or SHA)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-macos-apple-silicon:
    runs-on: macos-latest
    env:
      CI: "true"

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Prepare cache directories
        run: |
          mkdir -p ~/.cargo/registry
          mkdir -p ~/.cargo/git
          mkdir -p ~/.rustup
          mkdir -p ~/.cache/uv
          mkdir -p ~/.local/share/uv

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.toml',
            'frontend/src-tauri/Cargo.lock', 'polars-text/Cargo.toml',
            'polars-text/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache rustup toolchains
        uses: actions/cache@v5
        with:
          path: ~/.rustup
          key: ${{ runner.os }}-rustup-${{ hashFiles('frontend/src-tauri/Cargo.toml',
            'frontend/src-tauri/Cargo.lock', 'polars-text/Cargo.toml',
            'polars-text/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rustup-

      - name: Install uv CLI
        uses: astral-sh/setup-uv@v7

      - name: Cache uv workspace
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock',
            'backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install Node workspace dependencies
        shell: bash
        run: npm ci

      - name: Package backend runtime
        shell: bash
        run: uv run --no-project --python 3.14 python scripts/package_backend_runtime.py
          --clean --python-version 3.14

      - name: Stage backend runtime for Tauri
        shell: bash
        working-directory: frontend
        run: npm run stage:backend-runtime

      - name: Import Apple code-signing certificate
        uses: Apple-Actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: List codesigning identities in keychain
        shell: bash
        run: |
          echo "::group::All identities in signing_temp.keychain"
          security find-identity -v signing_temp.keychain || true
          echo "::endgroup::"
          echo "::group::Codesigning identities in signing_temp.keychain"
          security find-identity -v -p codesigning signing_temp.keychain || true
          echo "::endgroup::"
          echo "::group::Codesigning identities across default search list"
          security find-identity -v -p codesigning || true
          echo "::endgroup::"

      - name: Build Tauri desktop application
        shell: bash
        working-directory: frontend
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: npx tauri build --bundles app

      - name: Deep-sign embedded backend runtime + re-sign app
        shell: bash
        working-directory: frontend
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -Eeuo pipefail
          app_path="src-tauri/target/release/bundle/macos/LDaCA Wordflow.app"
          runtime="$app_path/Contents/Resources/backend-runtime"

          test -d "$runtime" || { echo "::error::backend-runtime missing inside .app"; exit 1; }

          # Strip extended attributes before signing — uv's managed-python tarball
          # and macOS file ops can leave com.apple.quarantine / com.apple.metadata.*
          # xattrs that get sealed into the signature and trip notarization with
          # "signature of the binary is invalid".
          xattr -cr "$app_path"

          # Sign every Mach-O file inside the embedded runtime (executables, .dylib, .so).
          # `file -b` identifies binary type; we skip non-Mach-O resources (json, py, etc).
          signed_count=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -qE '^Mach-O'; then
              codesign --force --options runtime --timestamp \
                --sign "$APPLE_SIGNING_IDENTITY" "$f"
              signed_count=$((signed_count + 1))
            fi
          done < <(find "$runtime" -type f -print0)
          echo "Signed $signed_count Mach-O files inside backend-runtime/"

          # Strip Tauri's pre-existing signature from the main binary first.
          # codesign --force on the bundle only signs the outer wrapper; it
          # does NOT re-sign an already-signed main executable. Without this,
          # Tauri's original signature (signed before the bundle was complete,
          # without bundle context) survives and the notary rejects it as
          # "signature of the binary is invalid".
          codesign --remove-signature "$app_path/Contents/MacOS/ldaca-wordflow"

          # Now sign the bundle. With the main binary unsigned, codesign signs
          # it in bundle context — proper Info.plist binding included.
          codesign --force --options runtime --timestamp \
            --identifier au.edu.ldaca.wordflow \
            --entitlements src-tauri/entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" "$app_path"

          echo "::group::codesign -dvv on main binary"
          codesign -dvv "$app_path/Contents/MacOS/ldaca-wordflow" 2>&1 || true
          echo "::endgroup::"

          echo "::group::codesign -dvv on outer .app"
          codesign -dvv "$app_path" 2>&1 || true
          echo "::endgroup::"

          echo "::group::codesign --verify --strict --deep on whole bundle"
          codesign --verify --strict --deep --verbose=4 "$app_path"
          echo "::endgroup::"

      - name: Notarize .app and staple
        shell: bash
        working-directory: frontend
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -Eeuo pipefail
          app_path="src-tauri/target/release/bundle/macos/LDaCA Wordflow.app"
          zip_path="$(mktemp -d)/ldaca.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$zip_path"

          echo "::group::notarytool submit (this can take several minutes)"
          set +e
          xcrun notarytool submit "$zip_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1 | tee /tmp/notarize.log
          submit_rc=${PIPESTATUS[0]}
          set -e
          echo "::endgroup::"

          # notarytool exits 0 even when status is Invalid; parse it explicitly.
          status=$(grep -E "^  status: " /tmp/notarize.log | tail -1 | awk '{print $2}')
          sub_id=$(grep -E "^  id: " /tmp/notarize.log | head -1 | awk '{print $2}')

          if [ "$status" != "Accepted" ] || [ $submit_rc -ne 0 ]; then
            echo "::error::Notarization failed (status=$status, rc=$submit_rc, id=$sub_id)"
            if [ -n "$sub_id" ]; then
              echo "::group::notarytool log $sub_id"
              xcrun notarytool log "$sub_id" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
              echo "::endgroup::"
            fi
            exit 1
          fi

          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"

      - name: Build DMG from notarized .app
        id: build-dmg
        shell: bash
        working-directory: frontend
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -Eeuo pipefail
          app_path="src-tauri/target/release/bundle/macos/LDaCA Wordflow.app"
          dmg_dir="src-tauri/target/release/bundle/dmg"
          mkdir -p "$dmg_dir"

          stage_dir="$(mktemp -d)"
          ditto "$app_path" "$stage_dir/LDaCA Wordflow.app"
          ln -s /Applications "$stage_dir/Applications"

          app_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          dmg_path="$dmg_dir/LDaCA Wordflow_${app_version}_aarch64.dmg"

          hdiutil create -volname "LDaCA Wordflow" \
            -srcfolder "$stage_dir" \
            -ov -format UDZO \
            "$dmg_path"

          codesign --force --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$dmg_path"

          echo "path=$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Notarize DMG and staple
        shell: bash
        working-directory: frontend
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DMG_PATH: ${{ steps.build-dmg.outputs.path }}
        run: |
          set -Eeuo pipefail
          echo "::group::notarytool submit DMG"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          echo "::endgroup::"
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Verify Developer ID signature + notarization
        shell: bash
        working-directory: frontend
        env:
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -Eeuo pipefail
          repo_root="$(cd .. && pwd -P)"
          app_path="$repo_root/frontend/src-tauri/target/release/bundle/macos/LDaCA Wordflow.app"

          echo "::group::codesign -dvv"
          codesign -dvv "$app_path" 2>&1 | tee /tmp/codesign.out
          echo "::endgroup::"

          if ! grep -q "Authority=Developer ID Application" /tmp/codesign.out; then
            echo "::error::App is not signed with Developer ID"
            exit 1
          fi
          if ! grep -q "TeamIdentifier=$EXPECTED_TEAM_ID" /tmp/codesign.out; then
            echo "::error::Team identifier mismatch"
            exit 1
          fi

          echo "::group::spctl --assess"
          spctl --assess --verbose=4 --type execute "$app_path" 2>&1 | tee /tmp/spctl.out || true
          echo "::endgroup::"

          if grep -q "source=Notarized Developer ID" /tmp/spctl.out; then
            echo "App is Developer ID signed and notarized."
          elif grep -q "source=Developer ID" /tmp/spctl.out; then
            echo "::warning::Signed with Developer ID but NOT notarized — fresh Macs will still warn."
          else
            echo "::error::Gatekeeper rejected the bundle"
            exit 1
          fi

      - name: Validate bundled backend runtime
        shell: bash
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          repo_root="$(cd .. && pwd -P)"
          app_path="$repo_root/frontend/src-tauri/target/release/bundle/macos/LDaCA Wordflow.app"
          runtime_path="$app_path/Contents/Resources/backend-runtime"

          test -d "$runtime_path"
          test -f "$runtime_path/runtime-manifest.json"
          test -f "$runtime_path/python/lib/libpython3.14.dylib"

          # Ensure embedded Python can initialize stdlib and import bundled packages.
          "$runtime_path/python/bin/python3" -c "import encodings, ldaca_wordflow, polars_text, sys; print(sys.version)"

          echo "Bundled runtime validation succeeded: $runtime_path"

      - name: Label DMG output for Apple Silicon
        id: label-dmg
        shell: bash
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          repo_root="$(cd .. && pwd -P)"
          dmg_files=("$repo_root"/frontend/src-tauri/target/release/bundle/dmg/*.dmg)
          if [ ${#dmg_files[@]} -eq 0 ]; then
            echo "No DMG output found" >&2
            exit 1
          fi
          primary_dmg="${dmg_files[0]}"
          app_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          labeled_dmg="$repo_root/frontend/src-tauri/target/release/bundle/dmg/ldaca-desktop-apple-silicon-${app_version}.dmg"
          cp "$primary_dmg" "$labeled_dmg"
          echo "path=$labeled_dmg" >> "$GITHUB_OUTPUT"
          echo "Primary DMG: $primary_dmg"
          echo "Labeled DMG: $labeled_dmg"

      - name: Upload macOS Apple Silicon DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: ldaca-desktop-macos-apple-silicon
          path: ${{ steps.label-dmg.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Tar signed .app on failure (preserves _CodeSignature/CodeResources)
        if: failure()
        shell: bash
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          app_dir="src-tauri/target/release/bundle/macos"
          if [ -d "$app_dir/LDaCA Wordflow.app" ]; then
            tar -C "$app_dir" -czf /tmp/ldaca-wordflow-app.tgz "LDaCA Wordflow.app"
            ls -la /tmp/ldaca-wordflow-app.tgz
          else
            echo "No .app to tar"
          fi

      - name: Upload signed .app tarball on failure (for offline inspection)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ldaca-wordflow-app-failure
          path: /tmp/ldaca-wordflow-app.tgz
          if-no-files-found: warn
          retention-days: 7
