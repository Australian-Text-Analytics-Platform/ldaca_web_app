name: Desktop macOS Build (Apple Silicon)

on:
  workflow_dispatch:
    inputs:
      build-notes:
        description: "Optional note about this build"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-macos-apple-silicon:
    runs-on: macos-latest
    env:
      CI: "true"

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Prepare cache directories
        run: |
          mkdir -p ~/.cargo/registry
          mkdir -p ~/.cargo/git
          mkdir -p ~/.rustup
          mkdir -p ~/.cache/uv
          mkdir -p ~/.local/share/uv

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml', 'frontend/src-tauri/Cargo.lock', 'polars-text/Cargo.toml', 'polars-text/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache rustup toolchains
        uses: actions/cache@v5
        with:
          path: ~/.rustup
          key: ${{ runner.os }}-rustup-${{ hashFiles('Cargo.toml', 'frontend/src-tauri/Cargo.lock', 'polars-text/Cargo.toml', 'polars-text/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rustup-

      - name: Install uv CLI
        uses: astral-sh/setup-uv@v6

      - name: Cache uv workspace
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('ldaca_web_app_backend/uv.lock', 'ldaca_web_app_backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install Node workspace dependencies
        shell: bash
        run: npm ci

      - name: Package backend runtime
        shell: bash
        run: uv run --no-project --python 3.14 python scripts/package_backend_runtime.py --clean --python-version 3.14

      - name: Stage backend runtime for Tauri
        shell: bash
        working-directory: frontend
        run: npm run stage:backend-runtime

      - name: Build Tauri desktop application
        shell: bash
        working-directory: frontend
        run: npx tauri build

      - name: Create DMG
        shell: bash
        working-directory: frontend
        run: npx create-dmg "../target/release/bundle/macos/LDaCA Text Analytics.app" "../target/release/bundle/macos/" --overwrite --no-code-sign

      - name: Validate bundled backend runtime
        shell: bash
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          app_path="../target/release/bundle/macos/LDaCA Text Analytics.app"
          runtime_path="$app_path/Contents/Resources/backend-runtime"

          test -d "$runtime_path"
          test -f "$runtime_path/runtime-manifest.json"
          test -f "$runtime_path/python/lib/libpython3.14.dylib"

          # Ensure embedded Python can initialize stdlib and import bundled packages.
          "$runtime_path/python/bin/python3" -c "import encodings, ldaca_web_app_backend, polars_text, sys; print(sys.version)"

          echo "Bundled runtime validation succeeded: $runtime_path"

      - name: Label DMG output for Apple Silicon
        id: label-dmg
        shell: bash
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          repo_root="$(cd .. && pwd -P)"
          dmg_files=("$repo_root"/target/release/bundle/macos/*.dmg)
          if [ ${#dmg_files[@]} -eq 0 ]; then
            echo "No DMG output found" >&2
            exit 1
          fi
          primary_dmg="${dmg_files[0]}"
          labeled_dmg="$repo_root/target/release/bundle/macos/ldaca-desktop-apple-silicon.dmg"
          cp "$primary_dmg" "$labeled_dmg"
          echo "path=$labeled_dmg" >> "$GITHUB_OUTPUT"
          echo "Primary DMG: $primary_dmg"
          echo "Labeled DMG: $labeled_dmg"

      - name: Upload macOS Apple Silicon DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: ldaca-desktop-macos-apple-silicon
          path: ${{ steps.label-dmg.outputs.path }}
          if-no-files-found: error
          retention-days: 14
