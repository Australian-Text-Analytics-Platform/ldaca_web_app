name: Desktop Windows Build

on:
  workflow_dispatch:
    inputs:
      build-notes:
        description: "Optional note about this build"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CI: "true"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          # Enable long path support for Git and Windows
          git config --global core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force -ErrorAction SilentlyContinue

      - name: Checkout repository with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml',
            'frontend/src-tauri/Cargo.lock', 'polars-text/Cargo.toml',
            'polars-text/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install uv CLI
        uses: astral-sh/setup-uv@v7

      - name: Cache uv workspace
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock',
            'backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install Node workspace dependencies
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          npm ci

      - name: Build frontend and stage backend source
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          npm run deploy_frontend_to_backend

      - name: Package backend bundle (uv + source)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          uv run --no-project --python 3.14 python scripts/package_backend_runtime.py --clean

      - name: Build Tauri desktop application
        shell: pwsh
        working-directory: frontend
        run: |
          Set-StrictMode -Version Latest
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          npx tauri build

      - name: Validate bundle contents
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $staged = "frontend\src-tauri"
          if (-not (Test-Path (Join-Path $staged "uv-bin\uv.exe"))) {
            Write-Error "uv.exe missing from bundle staging"
            exit 1
          }
          if (-not (Test-Path (Join-Path $staged "backend-src\pyproject.toml"))) {
            Write-Error "backend-src/pyproject.toml missing"
            exit 1
          }
          if (-not (Test-Path (Join-Path $staged "backend-src\backend\src\ldaca_web_app"))) {
            Write-Error "backend source tree missing"
            exit 1
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ldaca-desktop-windows-msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
