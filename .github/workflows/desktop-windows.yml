name: Desktop Windows Build

on:
  workflow_dispatch:
    inputs:
      build-notes:
        description: "Optional note about this build"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CI: "true"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          # Enable long path support for Git and Windows
          git config --global core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force -ErrorAction SilentlyContinue

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Prepare cache directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.cargo\registry" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.cargo\git" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.rustup" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:LOCALAPPDATA\uv" | Out-Null

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml', 'frontend/src-tauri/Cargo.lock', 'polars-text/Cargo.toml', 'polars-text/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache rustup toolchains
        uses: actions/cache@v4
        with:
          path: ~/.rustup
          key: ${{ runner.os }}-rustup-${{ hashFiles('Cargo.toml', 'frontend/src-tauri/Cargo.lock', 'polars-text/Cargo.toml', 'polars-text/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rustup-

      - name: Install uv CLI
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          irm https://astral.sh/uv/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache uv workspace
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('ldaca_web_app_backend/uv.lock', 'ldaca_web_app_backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install Node workspace dependencies
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          npm ci

      - name: Package backend runtime
        shell: pwsh
        working-directory: ldaca_web_app_backend
        run: |
          Set-StrictMode -Version Latest
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          uv run --python 3.14 python scripts/package_backend_runtime.py --clean --python-version 3.14

      - name: Stage backend runtime for Tauri
        shell: pwsh
        working-directory: frontend
        run: |
          Set-StrictMode -Version Latest
          node scripts/stage-backend-runtime.mjs

      - name: Build Tauri desktop application
        shell: pwsh
        working-directory: frontend
        run: |
          Set-StrictMode -Version Latest
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "Building Tauri application with NSIS..."
          npx tauri build --bundles nsis

      - name: Validate bundled backend runtime
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $runtimeDir = "target\release\backend-runtime"
          $managedPython = @(Get-ChildItem -Path (Join-Path $runtimeDir "managed-python") -Directory -Filter "cpython-*" -ErrorAction SilentlyContinue | Select-Object -First 1)
          if ($managedPython.Count -gt 0) {
            $pythonExe = Join-Path $managedPython[0].FullName "python.exe"
          } else {
            $pythonExe = Join-Path $runtimeDir "python\Scripts\python.exe"
          }

          if (-not (Test-Path $runtimeDir)) {
            Write-Error "Bundled backend runtime not found at $runtimeDir"
            exit 1
          }

          if (-not (Test-Path (Join-Path $runtimeDir "runtime-manifest.json"))) {
            Write-Error "runtime-manifest.json missing from bundled runtime"
            exit 1
          }

          if (-not (Test-Path $pythonExe)) {
            Write-Error "Bundled Python interpreter not found at $pythonExe"
            exit 1
          }

          & $pythonExe -c "import encodings, ldaca_web_app_backend, polars_text, sys; print(sys.version)"
          Write-Host "Bundled runtime validation succeeded: $runtimeDir"

      - name: Gather Windows bundles
        id: gather-bundles
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $bundleRoot = "target/release/bundle"
          if (-not (Test-Path $bundleRoot)) {
            Write-Error "Bundle output not found at $bundleRoot"
            exit 1
          }

          # List all available bundles
          Write-Host "Available bundle directories:"
          Get-ChildItem -Path $bundleRoot -Directory | ForEach-Object { Write-Host "  $($_.Name)" }

          # Find installer files
          $archives = @(Get-ChildItem -Path $bundleRoot -Recurse -Include *.exe,*.msi -ErrorAction SilentlyContinue)
          if ($archives.Count -eq 0) {
            Write-Error "No Windows installer artifacts found"
            exit 1
          }

          Write-Host "`nFound installers:"
          $archives | ForEach-Object { Write-Host "  $($_.FullName)" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ldaca-desktop-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload NSIS installer (primary)
        uses: actions/upload-artifact@v4
        with:
          name: ldaca-desktop-windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
