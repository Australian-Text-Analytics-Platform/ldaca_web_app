name: Desktop Windows Build

on:
  workflow_dispatch:
    inputs:
      build-notes:
        description: "Optional note about this build"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CI: "true"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          # Enable long path support for Git and Windows
          git config --global core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force -ErrorAction SilentlyContinue

      - name: Checkout repository with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml', 'frontend/src-tauri/Cargo.lock', 'polars-text/Cargo.toml', 'polars-text/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install uv CLI
        uses: astral-sh/setup-uv@v7

      - name: Cache uv workspace
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install Node workspace dependencies
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          npm ci

      - name: Package backend runtime
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          uv run --no-project --python 3.14 python scripts/package_backend_runtime.py --clean --python-version 3.14

      - name: Stage backend runtime for Tauri
        shell: pwsh
        working-directory: frontend
        run: |
          Set-StrictMode -Version Latest
          node scripts/stage-backend-runtime.mjs

      - name: Build Tauri desktop application
        shell: pwsh
        working-directory: frontend
        run: |
          Set-StrictMode -Version Latest
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          npx tauri build

      - name: Validate bundled backend runtime
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $runtimeDir = "target\release\backend-runtime"
          $pythonExe = Join-Path $runtimeDir "python\Scripts\python.exe"

          if (-not (Test-Path (Join-Path $runtimeDir "runtime-manifest.json"))) {
            Write-Error "runtime-manifest.json missing from bundled runtime"
            exit 1
          }

          & $pythonExe -c "import encodings, ldaca_web_app, polars_text, sys; print(sys.version)"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ldaca-desktop-windows-msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
