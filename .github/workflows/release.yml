name: Backend Package Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_target:
        description: Optional package index for a manual publish of the selected ref
        type: choice
        required: true
        default: none
        options:
          - none
          - testpypi

concurrency:
  group: backend-package-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Build release artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with source dependencies
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Check release tag and shared version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-versions.mjs --tag "$GITHUB_REF_NAME"

      - name: Build and stage frontend
        run: pnpm deploy_frontend_to_backend

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: backend/uv.lock

      - name: Build backend without source overrides
        working-directory: backend
        run: uv build --no-sources

      - name: Validate distribution metadata and contents
        shell: bash
        run: |
          set -Eeuo pipefail
          uvx twine check --strict backend/dist/*
          python scripts/verify_backend_distribution.py backend/dist

      - name: Smoke-install using published dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          uv venv --python 3.14 "$RUNNER_TEMP/backend-package-smoke"
          uv pip install --python "$RUNNER_TEMP/backend-package-smoke/bin/python" --no-sources backend/dist/*.whl
          "$RUNNER_TEMP/backend-package-smoke/bin/python" -c "import ldaca_wordflow; from ldaca_wordflow.main import create_app; assert callable(create_app)"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: backend-distributions
          path: backend/dist/*
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: backend-distributions
          path: dist

      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: backend-distributions
          path: dist

      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
