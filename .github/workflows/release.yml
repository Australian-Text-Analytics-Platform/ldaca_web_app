name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build manually, e.g. dev"
        required: false
        type: string
        default: "dev"
      publish_release:
        description: "Publish artifacts to a GitHub release"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag to publish when publish_release is enabled"
        required: false
        type: string

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-versions:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          # backend/pyproject.toml lives in the backend submodule, so the
          # gate needs the submodule trees on disk before it can read all
          # five version sources. Default checkout omits submodules; the
          # build-windows / build-macos jobs already opt in, so this
          # mirrors them.
          submodules: recursive

      - name: Check that all 5 version-bearing files agree
        run: node scripts/check-versions.mjs

  build-windows:
    name: Build Windows MSI
    needs: verify-versions
    uses: ./.github/workflows/desktop-windows.yml
    with:
      build-notes: ${{ github.event_name == 'workflow_dispatch' && format('Manual desktop build for {0}', inputs.ref) || format('Automated desktop release build for {0}', github.ref_name) }}
      debug: false
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

  build-macos:
    name: Build macOS DMG
    needs: verify-versions
    uses: ./.github/workflows/desktop-macos.yml
    with:
      build-notes: ${{ github.event_name == 'workflow_dispatch' && format('Manual desktop build for {0}', inputs.ref) || format('Automated desktop release build for {0}', github.ref_name) }}
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

  publish-release:
    name: Publish Desktop Assets
    if: ${{ github.event_name == 'push' || inputs.publish_release }}
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: ldaca-desktop-windows-msi
          path: release-assets/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: ldaca-desktop-macos-apple-silicon
          path: release-assets/macos

      - name: Create or update GitHub release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          release_tag="${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}"

          if [ -z "$release_tag" ]; then
            echo "release_tag input is required when publish_release is true" >&2
            exit 1
          fi

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" \
              release-assets/windows/*.msi \
              release-assets/macos/*.dmg \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$release_tag" \
              release-assets/windows/*.msi \
              release-assets/macos/*.dmg \
              --generate-notes \
              --title "$release_tag" \
              --repo "$GITHUB_REPOSITORY"
          fi
