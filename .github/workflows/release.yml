name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional Git ref override; defaults to the selected workflow branch"
        required: false
        type: string
        default: ""
      publish_release:
        description: "Publish artifacts to a GitHub release"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag to publish when publish_release is enabled"
        required: false
        type: string

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-versions:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0
          # backend/pyproject.toml lives in the backend submodule, so the
          # gate needs the submodule trees on disk before it can read all
          # six version sources. Default checkout omits submodules; the
          # build-windows / build-macos jobs already opt in, so this
          # mirrors them.
          submodules: recursive

      - name: Check version, lock, and release-tag identity
        env:
          EXPECTED_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.publish_release && inputs.release_tag || '' }}
        run: node scripts/check-versions.mjs --tag "$EXPECTED_RELEASE_TAG"

      - name: Require the release tag to identify the checked-out commit
        if: github.event_name == 'push' || inputs.publish_release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            echo "release_tag is required when publishing a release" >&2
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [ "$checked_out_sha" != "$release_sha" ]; then
            echo "Checked-out commit $checked_out_sha does not match $RELEASE_TAG ($release_sha)" >&2
            exit 1
          fi

  build-desktop:
    name: Build ${{ matrix.name }}
    needs: verify-versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSI
            platform: windows
          - name: macOS DMG
            platform: macos
    uses: ./.github/workflows/desktop-build.yml
    # The macOS build signs and notarizes with the APPLE_* repo secrets;
    # called workflows receive no secrets unless the caller forwards them.
    secrets: inherit
    with:
      platform: ${{ matrix.platform }}
      debug: false
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

  publish-release:
    name: Publish Desktop Assets
    if: ${{ github.event_name == 'push' || inputs.publish_release }}
    needs:
      - build-desktop
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: ldaca-desktop-windows-msi
          path: release-assets/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: ldaca-desktop-macos-apple-silicon
          path: release-assets/macos

      - name: Create or update GitHub release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          release_tag="${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}"

          if [ -z "$release_tag" ]; then
            echo "release_tag input is required when publish_release is true" >&2
            exit 1
          fi

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" \
              release-assets/windows/*.msi \
              release-assets/macos/*.dmg \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$release_tag" \
              release-assets/windows/*.msi \
              release-assets/macos/*.dmg \
              --generate-notes \
              --title "$release_tag" \
              --repo "$GITHUB_REPOSITORY"
          fi
