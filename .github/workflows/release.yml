name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v0.2.2"
        required: true
        type: string

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows MSI
    uses: ./.github/workflows/desktop-windows.yml
    with:
      build-notes: ${{ github.event_name == 'workflow_dispatch' && format('Manual desktop release build for {0}', inputs.tag) || format('Automated desktop release build for {0}', github.ref_name) }}
      debug: false
      ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

  build-macos:
    name: Build macOS DMG
    uses: ./.github/workflows/desktop-macos.yml
    with:
      build-notes: ${{ github.event_name == 'workflow_dispatch' && format('Manual desktop release build for {0}', inputs.tag) || format('Automated desktop release build for {0}', github.ref_name) }}
      ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

  publish-release:
    name: Publish Desktop Assets
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: ldaca-desktop-windows-msi
          path: release-assets/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: ldaca-desktop-macos-apple-silicon
          path: release-assets/macos

      - name: Create or update GitHub release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          release_tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" \
              release-assets/windows/*.msi \
              release-assets/macos/*.dmg \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$release_tag" \
              release-assets/windows/*.msi \
              release-assets/macos/*.dmg \
              --generate-notes \
              --title "$release_tag" \
              --repo "$GITHUB_REPOSITORY"
          fi
